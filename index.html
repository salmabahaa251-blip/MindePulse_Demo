<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>MindPulse</title>
    <style>
         :root {
            --m: #7ED8B8;
            --ml: #EAF6F1;
            --md: #4A9C80;
            --bt: #12819a;
            --sage: #B7D6C8;
            --mt: #E3F6EE;
            --bg: #F3FAF7;
            --tx: #14211C;
            --card: rgba(255, 255, 255, .84);
            --bd: rgba(42, 107, 85, .16);
            --red: #B3261E;
            --amb: #8A5A00;
            --fs: 16px;
            --in: #fff;
            color-scheme: light
        }
        
         :root[data-theme=dark] {
            --bg: #0e1a15;
            --tx: #e8f2ed;
            --in: #14241d;
            --bt: #2F6B57;
            --mt: rgba(126, 216, 184, .14);
            --card: rgba(143, 179, 163, .12);
            --red: #ff8a80;
            --amb: #ffc857;
            --bd: rgba(143, 179, 163, .35);
            color-scheme: dark
        }
        
         :root.hc {
            --bg: #fff;
            --tx: #000;
            --card: #fff;
            --bd: #000;
            --bt: #004d3a;
            --in: #fff
        }
        
         :root.hc[data-theme=dark] {
            --bg: #000;
            --tx: #fff;
            --in: #000;
            --bd: #fff
        }
        
        * {
            box-sizing: border-box
        }
        
        html {
            font-size: var(--fs)
        }
        
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
            background: linear-gradient(135deg, var(--bg), color-mix(in srgb, var(--sage) 28%, var(--bg)));
            background-attachment: fixed;
            color: var(--tx);
            min-height: 100vh;
            line-height: 1.5
        }
        
        .sr {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0)
        }
        
        .skip {
            position: absolute;
            inset-inline-start: 8px;
            top: -60px;
            background: var(--bt);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            z-index: 99
        }
        
        .skip:focus {
            top: 8px
        }
        
         :focus-visible {
            outline: 3px solid var(--tx);
            outline-offset: 2px
        }
        
        nav {
            position: fixed;
            inset-block: 0;
            inset-inline-start: 0;
            width: 210px;
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--card);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-inline-end: 1px solid var(--bd);
            z-index: 5
        }
        
        nav h2 {
            margin: 0 8px 12px;
            font-size: 1.2rem;
            color: var(--bt)
        }
        
         :root[data-theme=dark] nav h2 {
            color: var(--m)
        }
        
        nav button {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border: 0;
            border-radius: 12px;
            background: transparent;
            color: var(--tx);
            font: inherit;
            cursor: pointer;
            text-align: start
        }
        
        nav button[aria-current=page] {
            background: var(--bt);
            color: #fff
        }
        
        nav svg {
            width: 24px;
            height: 24px;
            flex: none
        }
        
        main {
            margin-inline-start: 210px;
            padding: 24px;
            max-width: 1100px
        }
        
        main:focus {
            outline: none
        }
        
        .glass {
            background: var(--card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--bd);
            border-radius: 16px;
            padding: 16px
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px
        }
        
        h1 {
            margin: 0 0 16px;
            font-size: 1.6rem
        }
        
        h3 {
            margin: 0 0 8px
        }
        
        .btn {
            background: var(--bt);
            color: #fff;
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 10px 18px;
            font: inherit;
            font-weight: 600;
            cursor: pointer
        }
        
        .btn.alt {
            background: transparent;
            color: var(--tx);
            border-color: var(--bd)
        }
        
        .add {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            margin-bottom: 16px;
            text-align: start;
            color: var(--tx);
            font: inherit;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer
        }
        
        .plus {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bt);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 1.6rem
        }
        
        label {
            display: block;
            margin: 10px 0 4px;
            font-weight: 600
        }
        
        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--bd);
            border-radius: 10px;
            background: var(--in);
            color: var(--tx);
            font: inherit
        }
        
        .pc {
            cursor: pointer;
            text-align: start;
            color: var(--tx);
            font: inherit;
            border-inline-start-width: 8px
        }
        
        .s-crit {
            border-color: var(--red)
        }
        
        .s-mod {
            border-color: var(--amb)
        }
        
        .s-ok {
            border-color: var(--md)
        }
        
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 99px;
            font-weight: 700;
            font-size: .85rem;
            border: 2px solid currentColor
        }
        
        .t-crit {
            color: var(--red)
        }
        
        .t-mod {
            color: var(--amb)
        }
        
        .t-ok {
            color: var(--bt)
        }
        
         :root[data-theme=dark] .t-ok {
            color: var(--m)
        }
        
        .met {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin: 12px 0
        }
        
        .met b {
            display: block;
            font-size: 1.6rem
        }
        
        table {
            width: 100%;
            border-collapse: collapse
        }
        
        th,
        td {
            padding: 8px;
            text-align: start;
            border-bottom: 1px solid var(--bd)
        }
        
        .chat {
            height: 260px;
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 10px 0
        }
        
        .msg {
            padding: 8px 12px;
            border-radius: 12px;
            max-width: 85%
        }
        
        .bot {
            background: var(--card);
            border: 1px solid var(--bd);
            align-self: flex-start
        }
        
        .me {
            background: var(--bt);
            color: #fff;
            align-self: flex-end
        }
        
        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center
        }
        
        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--card);
            border: 2px solid var(--bd);
            display: grid;
            place-items: center;
            font-size: 2rem
        }
        
        dialog {
            border: 1px solid var(--bd);
            border-radius: 16px;
            background: var(--bg);
            color: var(--tx);
            padding: 20px;
            width: min(480px, 92vw)
        }
        
        dialog::backdrop {
            background: rgba(0, 0, 0, .45);
            backdrop-filter: blur(4px)
        }
        
        .pulse {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: currentColor;
            animation: p 1.2s infinite
        }
        
        @keyframes p {
            50% {
                opacity: .25
            }
        }
        
        .nomo *,
        .nomo {
            animation: none!important;
            transition: none!important
        }
        
        .err {
            color: var(--red);
            font-weight: 600
        }
        
        nav {
            background: linear-gradient(180deg, #2B6A55, #235A48);
            border-inline-end: 0;
            color: #fff
        }
        
        nav h2,
         :root[data-theme=dark] nav h2 {
            color: #BFE9D8
        }
        
        nav button {
            color: #E6F1EC
        }
        
        nav button:hover {
            background: rgba(255, 255, 255, .12)
        }
        
        nav button[aria-current=page] {
            background: #BFE9D8;
            color: #12392d
        }
        
        nav :focus-visible {
            outline-color: #fff
        }
        
        .glass {
            box-shadow: 0 8px 24px rgba(20, 33, 28, .08)
        }
        
        .auth {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 72px 16px 24px;
            position: relative
        }
        
        .auth-top {
            position: absolute;
            top: 16px;
            inset-inline-end: 16px
        }
        
        .auth-card {
            width: min(440px, 100%);
            padding: 28px;
            background: rgba(255, 255, 255, .72)
        }
        
         :root[data-theme=dark] .auth-card {
            background: var(--card)
        }
        
        .brand {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px
        }
        
        .brand h1 {
            margin: 0
        }
        
        .brand p {
            margin: 0;
            opacity: .8;
            font-size: .9rem
        }
        
        .logo {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: var(--bt);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 1.5rem;
            flex: none
        }
        
        .tabs {
            display: flex;
            gap: 6px;
            padding: 4px;
            border-radius: 12px;
            background: rgba(42, 107, 85, .12);
            margin-bottom: 8px
        }
        
        .tabs button {
            flex: 1;
            padding: 10px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: var(--tx);
            font: inherit;
            font-weight: 600;
            cursor: pointer
        }
        
        .tabs button[aria-selected=true] {
            background: var(--bt);
            color: #fff
        }
        
        .auth fieldset {
            border: 0;
            padding: 0;
            margin: 0
        }
        
        .auth legend {
            font-weight: 600;
            margin-top: 8px
        }
        
        .auth fieldset label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 4px 0 0;
            margin-inline-end: 14px;
            font-weight: 500
        }
        
        @media(max-width:700px) {
            nav {
                inset-block: auto 0;
                inset-inline: 0;
                width: auto;
                flex-direction: row;
                justify-content: space-around;
                padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
                border-inline-end: 0;
                border-top: 1px solid var(--bd)
            }
            nav h2,
            nav span {
                display: none
            }
            nav button {
                flex-direction: column;
                padding: 8px 20px
            }
            main {
                margin-inline-start: 0;
                padding: 16px 16px 100px
            }
        }
        
        .hd {
            position: sticky;
            top: 0;
            z-index: 6;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 24px;
            background: rgba(255, 255, 255, .92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bd)
        }
        
         :root[data-theme=dark] .hd {
            background: rgba(14, 26, 21, .92)
        }
        
        .hd .logo {
            width: 44px;
            height: 44px
        }
        
        .hd .bn {
            font-size: 1.4rem;
            font-weight: 800
        }
        
        .hd .sub {
            margin: 0;
            font-size: .85rem;
            opacity: .8
        }
        
        .hd .sp {
            flex: 1
        }
        
        .pill {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 99px;
            background: var(--mt);
            color: var(--bt);
            font-size: .7rem;
            font-weight: 800;
            letter-spacing: .06em;
            border: 1px solid var(--bd);
            vertical-align: middle
        }
        
         :root[data-theme=dark] .pill {
            color: var(--m)
        }
        
        nav {
            background: var(--card);
            color: var(--tx)
        }
        
        nav button {
            color: var(--tx)
        }
        
        nav button:hover {
            background: var(--mt)
        }
        
        nav button[aria-current=page] {
            background: var(--bt);
            color: #fff
        }
        
        nav :focus-visible {
            outline-color: var(--tx)
        }
        
        .navlab {
            margin: 4px 10px 6px;
            font-size: .72rem;
            font-weight: 800;
            letter-spacing: .1em;
            opacity: .7
        }
        
        .api {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            padding: 12px 10px 4px;
            border-top: 1px solid var(--bd);
            font-family: ui-monospace, Consolas, monospace;
            font-size: .8rem
        }
        
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--m)
        }
        
        .isef {
            margin-top: 10px;
            padding: 14px;
            border-radius: 16px;
            background: linear-gradient(160deg, #2E7660, #2A6B55);
            color: #fff
        }
        
        .isef b {
            display: block;
            color: #CDEFE0;
            font-size: .9rem
        }
        
        .isef q {
            display: block;
            margin: 6px 0;
            font-weight: 700
        }
        
        .isef small {
            color: #CDEFE0
        }
        
        .card {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 6px 20px rgba(20, 33, 28, .06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px)
        }
        
        .mono {
            font-family: ui-monospace, Consolas, monospace
        }
        
        .bar {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 18px
        }
        
        .bar input {
            flex: 1 1 200px;
            width: auto
        }
        
        .bar select {
            width: auto;
            flex: 0 0 auto
        }
        
        .add2 {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem
        }
        
        .grid3 {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px
        }
        
        .pc.card {
            cursor: pointer;
            text-align: start;
            color: var(--tx);
            font: inherit;
            display: block;
            width: 100%;
            transition: transform .15s
        }
        
        .pc.card:hover {
            transform: translateY(-2px)
        }
        
        .pc.s-crit {
            border: 3px solid var(--red)
        }
        
        .pc.s-mod {
            border: 2px solid #E5B84B
        }
        
        .pc.s-ok {
            border: 1px solid var(--bd)
        }
        
        .ph {
            display: flex;
            align-items: center;
            gap: 12px
        }
        
        .pn {
            flex: 1;
            min-width: 0
        }
        
        .pn b {
            display: block;
            font-size: 1.1rem
        }
        
        .pn span {
            font-size: .8rem;
            opacity: .75
        }
        
        .av {
            flex: none;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-weight: 800;
            background: linear-gradient(135deg, #D8F3E8, #9ED9BF);
            color: #14392c
        }
        
        .rk {
            font-size: .7rem;
            font-weight: 800;
            letter-spacing: .04em;
            padding: 5px 10px;
            border-radius: 99px;
            border: 1px solid currentColor;
            white-space: nowrap
        }
        
        .b-crit {
            background: rgba(179, 38, 30, .1)
        }
        
        .b-mod {
            background: rgba(229, 184, 75, .2)
        }
        
        .b-ok {
            background: var(--mt)
        }
        
        .bc {
            margin: 12px 0;
            font-weight: 600
        }
        
        .mx {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 12px;
            border: 1px solid var(--bd);
            border-radius: 14px;
            background: var(--mt);
            text-align: center
        }
        
        .mx small {
            display: block;
            opacity: .75
        }
        
        .mx b {
            font-size: 1.2rem
        }
        
        .gf {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--bd);
            font-size: .9rem
        }
        
        .dh {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap
        }
        
        .ibox {
            padding: 10px 14px;
            border: 1px solid var(--bd);
            border-radius: 14px;
            background: var(--mt)
        }
        
        .ibox small {
            display: block;
            opacity: .75
        }
        
        .chip {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 8px;
            background: var(--mt);
            border: 1px solid var(--bd);
            font-size: .8rem;
            vertical-align: middle
        }
        
        .two {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
            margin: 18px 0
        }
        
        @media(min-width:701px) {
            nav {
                inset-block: 100px auto;
                inset-inline-start: 16px;
                width: 228px;
                border-radius: 20px;
                border: 1px solid var(--bd);
                padding: 14px 12px;
                max-height: calc(100vh - 116px);
                overflow: auto;
                gap: 4px
            }
            main {
                margin-inline-start: 268px;
                padding-top: 24px
            }
        }
        
        @media(max-width:1000px) {
            .hd .sub {
                display: none
            }
        }
        
        @media(max-width:700px) {
            .isef,
            .api,
            .navlab,
            .hd .pill.ed {
                display: none
            }
            .hd {
                padding: 10px 14px;
                padding-top: calc(10px + env(safe-area-inset-top, 0px))
            }
            .hd .bn {
                font-size: 1.2rem
            }
            nav {
                background: var(--card)
            }
        }
        /* ================================
   MINDPULSE - FINAL DESIGN UPDATE
================================ */
        
         :root {
            --bt: #129a84;
            --m: #65cdb1;
            --ml: #e4f7f1;
            --md: #087c69;
            --sage: #b7e3d5;
            --mt: #e8f7f2;
            --bg: #f3faf8;
            --tx: #18332c;
            --card: rgba(255, 255, 255, .82);
            --bd: rgba(18, 154, 132, .18);
            --in: rgba(255, 255, 255, .92);
            --shadow: 0 8px 28px rgba(18, 80, 68, .08);
            --shadow-hover: 0 14px 35px rgba(18, 80, 68, .14);
        }
        
         :root[data-theme="dark"] {
            --bt: #35b99d;
            --m: #65d8bb;
            --ml: #193d34;
            --md: #45c3a4;
            --sage: #28594b;
            --mt: rgba(53, 185, 157, .13);
            --bg: #101c19;
            --tx: #e5f4ef;
            --card: rgba(27, 48, 42, .82);
            --bd: rgba(101, 216, 187, .19);
            --in: #172b25;
            --shadow: 0 8px 28px rgba(0, 0, 0, .18);
            --shadow-hover: 0 14px 35px rgba(0, 0, 0, .28);
        }
        /* General */
        
        * {
            scroll-behavior: smooth;
        }
        
        body {
            background: radial-gradient( circle at 10% 10%, rgba(18, 154, 132, .08), transparent 35%), linear-gradient( 135deg, var(--bg), color-mix(in srgb, var(--sage) 18%, var(--bg)));
            transition: background .3s ease, color .3s ease;
        }
        /* Header */
        
        .hd {
            background: rgba(255, 255, 255, .68);
            backdrop-filter: blur(22px) saturate(160%);
            -webkit-backdrop-filter: blur(22px) saturate(160%);
            border-bottom: 1px solid var(--bd);
            box-shadow: 0 4px 20px rgba(18, 80, 68, .04);
            transition: background .3s ease;
        }
        
         :root[data-theme="dark"] .hd {
            background: rgba(16, 28, 25, .72);
        }
        /* Desktop Navigation */
        
        @media (min-width: 701px) {
            nav {
                background: rgba(255, 255, 255, .68);
                backdrop-filter: blur(22px) saturate(160%);
                -webkit-backdrop-filter: blur(22px) saturate(160%);
                border: 1px solid var(--bd);
                box-shadow: var(--shadow);
            }
             :root[data-theme="dark"] nav {
                background: rgba(27, 48, 42, .78);
            }
            nav button {
                border-radius: 13px;
                transition: background .25s ease, color .25s ease, transform .25s ease;
            }
            nav button:hover {
                background: var(--mt);
                transform: translateX(3px);
            }
            nav button[aria-current="page"] {
                background: var(--bt);
                color: white;
                box-shadow: 0 5px 15px rgba(18, 154, 132, .2);
            }
        }
        /* Cards */
        
        .glass,
        .card,
        .auth-card {
            border: 1px solid var(--bd);
            box-shadow: var(--shadow);
            transition: transform .3s ease, box-shadow .3s ease, background .3s ease;
        }
        
        .pc.card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }
        
        .grid3>*,
        .grid>* {
            animation: cardEnter .5s ease both;
        }
        
        .grid3>*:nth-child(2),
        .grid>*:nth-child(2) {
            animation-delay: .06s;
        }

function loginDlg(){dlg(`<h2 id="dt">${t("login")}</h2><form id="f"><fieldset style="border:0;padding:0"><legend>${t("role")}</legend><label><input type="radio" name="r" value="doc" checked style="width:auto"> ${t("doctor")}</label><label><input type="radio" name="r" value="pat" style="width:auto"> ${t("patient")}</label><label><input type="radio" name="r" value="gua" style="width:auto"> ${t("gua")}</label></fieldset><label for="u">${t("email")}</label><input id="u" required autocomplete="username"><label for="p">${t("pass")}</label><input id="p" type="password" required autocomplete="current-password"><p id="er" class="err" role="alert"></p><div class="row"><button class="btn">${t("login")}</button><button type="button" class="btn alt" data-x>${t("cancel")}</button></div><p><small>${t("demo")}</small></p></form>`,d=>{d.querySelector("#f").onsubmit=e=>{e.preventDefault();const r=d.querySelector("[name=r]:checked").value,u=d.querySelector("#u").value.trim(),p=d.querySelector("#p").value;
if(r!=="pat"){const x=r==="doc"?docs.find(o=>o.mail===u&&o.pw===p):guards.find(o=>o.id===u&&o.pw===p);if(!x)return d.querySelector("#er").textContent=t("bad");S.user=Object.assign(x,{type:r});d.close();go("home");say(t("hello")+" "+L(x.name))}
else{const x=pats.find(o=>o.id===u&&o.pw===p);if(!x)return d.querySelector("#er").textContent=t("bad");S.user=Object.assign(x,{type:"pat"});d.close();go("home");if(x.first){x.first=false;consentDlg()}}}})}
function consentDlg(){dlg(`<h2 id="dt">${t("cT")}</h2><p>${t("cP")}</p><div class="row"><button class="btn" id="ya">${t("agree")}</button><button class="btn alt" data-x>${t("dec")}</button></div>`,d=>{d.querySelector("#ya").onclick=()=>{S.user.consent=true;d.close();say(t("on"))}})}
function regDlg(){dlg(`<h2 id="dt">${t("register")}</h2><form id="f"><label for="n">${t("name")}</label><input id="n" required><label for="s">${t("spec")}</label><input id="s" required><label for="m">${t("mail")}</label><input id="m" type="email" required><label for="p">${t("pass")}</label><input id="p" type="password" minlength="6" required><div class="row" style="margin-top:12px"><button class="btn">${t("create")}</button><button type="button" class="btn alt" data-x>${t("cancel")}</button></div></form>`,d=>{d.querySelector("#f").onsubmit=e=>{e.preventDefault();const o={mail:d.querySelector("#m").value,pw:d.querySelector("#p").value,name:d.querySelector("#n").value,spec:d.querySelector("#s").value};docs.push(o);S.user={type:"doc",...o};d.close();go("home")}})}
function addDlg(){dlg(`<h2 id="dt">${t("addP")}</h2><form id="f"><label for="n">${t("name")}</label><input id="n" required><label for="a">${t("age")}</label><input id="a" type="number" min="1" max="120" required><label for="b">${t("base")}</label><input id="b" required><label for="e">${t("emer")}</label><input id="e" type="tel" required><label for="gn">${t("gn")}</label><input id="gn" required><label for="gp">${t("gph")}</label><input id="gp" type="tel" required><div class="row" style="margin-top:12px"><button class="btn">${t("save")}</button><button type="button" class="btn alt" data-x>${t("cancel")}</button></div></form>`,d=>{d.querySelector("#f").onsubmit=e=>{e.preventDefault();const id="patient"+(pats.length+1),pw=Math.random().toString(36).slice(2,8),n=d.querySelector("#n").value;
const pid=100+extra.length,gid="guardian"+(guards.length+1),gpw=Math.random().toString(36).slice(2,8);pats.push({id,pw,name:n,first:true,consent:false,phone:"",pic:"",pid});guards.push({id:gid,pw:gpw,pid,name:d.querySelector("#gn").value,rel:{en:"Guardian",ar:"ولي الأمر"},phone:d.querySelector("#gp").value,notes:[]});extra.push({id:pid,n,age:d.querySelector("#a").value,lv:"ok",hr:74,tr:1.5,rk:10,eeg:4,ec:d.querySelector("#e").value,b:d.querySelector("#b").value,c:"c3"});
d.innerHTML=`<h2 id="dt">${t("created")}</h2><p>${t("patient")} — ${t("user")}: <b>${id}</b><br>${t("tmp")}: <b>${pw}</b></p><p>${t("gua")} — ${t("user")}: <b>${gid}</b><br>${t("tmp")}: <b>${gpw}</b></p><button class="btn" data-x>OK</button>`;d.querySelector("[data-x]").onclick=()=>{d.close();render()};d.querySelector("button").focus();say(t("created"))}})}
/* ---------- chatbot ---------- */
function chat(){const log=$("#chat"),add=(c,x)=>{const m=document.createElement("div");m.className="msg "+c;m.textContent=x;log.append(m);log.scrollTop=log.scrollHeight};
const reply=k=>setTimeout(()=>add("bot",k==="f"?t("f1")+" "+t("f2"):t({s:"r2",a:"r3",x:"r1"}[k]||"r0")),400);
document.querySelectorAll(".q").forEach(b=>b.onclick=()=>{add("me",b.textContent);reply(b.dataset.q)});
const send=()=>{const i=$("#ci"),v=i.value.trim();if(!v)return;add("me",v);i.value="";const l=v.toLowerCase();reply(/sleep|نوم|أرق/.test(l)?"s":/anx|قلق|خوف|توتر|worr/.test(l)?"a":/feel|sad|bad|حزين|تعب|شعور/.test(l)?"x":"f")};
$("#cs").onclick=send;$("#ci").onkeydown=e=>{if(e.key==="Enter")send()}}
render();
    </script>
</body>
